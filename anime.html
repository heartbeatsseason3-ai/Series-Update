<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Image Optimization CDN & DNS Preconnect -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #050505;
            --accent-red: #E50914;
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --nav-bg: rgba(5, 5, 5, 0.95);
            --card-bg: #111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        a { text-decoration: none; color: inherit; }
        ::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            background: var(--nav-bg);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-logo { display: flex; align-items: center; gap: 8px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; }
        .header-logo a img, .header-logo img { height: 36px; width: auto; object-fit: contain; display: block; }
        .header-right { display: flex; align-items: center; gap: 12px; }

        .page-title-section { padding: 20px 20px 10px 20px; }
        .page-title {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .title-accent {
            width: 4px;
            height: 28px;
            background-color: var(--accent-red);
            border-radius: 2px;
        }
        .page-subtitle { color: var(--text-muted); font-size: 13px; }

        .search-filter-row { display: flex; gap: 12px; padding: 10px 20px; }
        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: #1a1c23;
            border-radius: 12px;
            padding: 10px 16px;
            gap: 10px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .content-section { margin-bottom: 24px; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 12px 20px;
        }
        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .view-all { color: var(--text-muted); font-size: 12px; font-weight: 500; }

        .cards-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 20px;
            scroll-snap-type: x mandatory;
        }
        .movie-card {
            flex: 0 0 130px;
            scroll-snap-align: start;
            cursor: pointer;
        }
        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a2e;
            margin-bottom: 8px;
        }
        .poster-img { width: 100%; height: 100%; object-fit: cover; }
        .hd-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(0,0,0,0.7);
            color: #ffd700;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .card-meta { font-size: 11px; color: var(--text-muted); }
        .card-rating { font-size: 11px; color: #ffd700; margin-top: 2px; }
    </style>
</head>
<body>

    <header class="header">

        <div class="header-right">

            <button aria-label="Action" class="header-icon bell-container" onclick="window.location.href='notifications.html'">

    <!-- Page Title -->

    <!-- Supabase Connection & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="supabase-config.js?v=1789459272914"></script>
    <script src="script.js"></script>
    <script src="fullscreen-handler.js"></script>
    <script src="theme-handler.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('anime-content-container');
            const searchInput = document.getElementById('anime-search-input');
            let allAnimeData = [];

            // Notification dot logic
            if (localStorage.getItem('notificationsRead') !== 'true') {
                const dot = document.getElementById('nav-notif-dot');
                if (dot) dot.style.display = 'block';
            }

            // Anime Featured Banner Logic
            let animeHeroItems = [];
            let animeHeroIndex = 0;
            let animeHeroTimer = null;

            window.renderAnimeHeroIndex = function(index) {
                const heroSection = document.getElementById('anime-hero-banner');
                if (!heroSection || !animeHeroItems[index]) return;
                animeHeroIndex = index;
                const item = animeHeroItems[index];

                const rawLandscape = item.thumb_landscape || item.thumbLandscape || item.thumb_portrait || item.thumbPortrait || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1000&q=80';
                const landscapeImg = window.getOptimizedImageUrl ? window.getOptimizedImageUrl(rawLandscape, 800, 80) : rawLandscape;
                const descText = item.description || item.desc || 'Stream featured anime series in HD quality.';
                
                let dotsHtml = '';
                for (let i = 0; i < animeHeroItems.length; i++) {
                    dotsHtml += `<div class="dot ${i === index ? 'active' : ''}" onclick="event.stopPropagation(); window.renderAnimeHeroIndex(${i});"></div>`;
                }

                heroSection.innerHTML = `
                <div class="hero-card card" onclick="window.location.href='watch.html?id=${item.id}'" data-id="${item.id}">
                    <img src="${landscapeImg}" alt="${item.title}" class="hero-bg" fetchpriority="high" decoding="async" onerror="this.src='${item.thumb_portrait || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1000&q=80'}'">
                    <div class="hero-overlay">
                        <div class="hero-top-badges">
                            <span class="badge-featured">FEATURED ANIME 🌸</span>
                            <span class="badge-pagination">${index + 1} / ${animeHeroItems.length}</span>
                        </div>
                        <div class="hero-content">
                            <h1 class="hero-title">${item.title}</h1>
                            <p class="hero-desc">${descText.length > 80 ? descText.substring(0, 80) + '...' : descText}</p>
                            <div class="hero-actions">
                                <button class="btn btn-play" onclick="event.stopPropagation(); window.location.href='watch.html?id=${item.id}'">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                    Play Now
                                </button>
                                <button class="btn btn-info" onclick="event.stopPropagation(); window.location.href='watch.html?id=${item.id}'">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                    More Info
                                </button>
                            </div>
                        </div>
                        <div class="hero-dots">
                            ${dotsHtml}
                        </div>
                    </div>
                </div>`;
            };

            function initAnimeHeroBanner(items) {
                if (!items || items.length === 0) return;
                const featured = items.filter(i => i.featured);
                animeHeroItems = featured.length > 0 ? featured.slice(0, 5) : items.slice(0, 5);

                window.renderAnimeHeroIndex(0);

                if (animeHeroTimer) clearInterval(animeHeroTimer);
                if (animeHeroItems.length > 1) {
                    animeHeroTimer = setInterval(() => {
                        animeHeroIndex = (animeHeroIndex + 1) % animeHeroItems.length;
                        window.renderAnimeHeroIndex(animeHeroIndex);
                    }, 5000);
                }
            }

            // 1. Fetch Anime content from Supabase (by type 'Anime' OR category 'Anime')
            if (window.supabaseClient) {
                try {
                    const { data, error } = await window.supabaseClient
                        .from('content')
                        .select('*')
                        .or('type.ilike.%Anime%,category.ilike.%Anime%')
                        .order('created_at', { ascending: false });

                    if (!error && data && data.length > 0) {
                        allAnimeData = data;
                    }
                } catch(e) {}
            }

            // 2. Fallback to STRICT local anime app content / cache if DB data has no anime
            if (!allAnimeData || allAnimeData.length === 0) {
                if (window.app && window.app.content && window.app.content.length > 0) {
                    const animePool = window.app.content.filter(i => 
                        (i.type && i.type.toLowerCase().includes('anime')) || 
                        (i.category && i.category.toLowerCase().includes('anime'))
                    );
                    if (animePool.length > 0) {
                        allAnimeData = animePool.map(i => ({
                            id: i.id,
                            title: i.title,
                            thumb_portrait: i.thumbPortrait || i.thumb_portrait,
                            thumb_landscape: i.thumbLandscape || i.thumb_landscape,
                            category: i.category || 'Anime',
                            publish_date: i.publishDate || i.publish_date,
                            featured: i.featured || false,
                            description: i.desc || i.description
                        }));
                    }
                }
            }

            // 3. Ultimate Fallback Seed Anime Items if still empty
            if (!allAnimeData || allAnimeData.length === 0) {
                const fallbackSeed = (window.app ? window.app.getFallbackContent() : []).filter(i => 
                    (i.type && i.type.toLowerCase().includes('anime')) || 
                    (i.category && i.category.toLowerCase().includes('anime'))
                );
                allAnimeData = fallbackSeed.map(i => ({
                    id: i.id,
                    title: i.title,
                    thumb_portrait: i.thumbPortrait || i.thumb_portrait,
                    thumb_landscape: i.thumbLandscape || i.thumb_landscape,
                    category: i.category || 'Anime',
                    publish_date: i.publishDate || i.publish_date,
                    featured: i.featured || false,
                    description: i.desc || i.description
                }));
            }

            // Initialize Anime Hero Banner
            initAnimeHeroBanner(allAnimeData);

            function renderRows(items) {
                if (!container) return;
                if (!items || items.length === 0) {
                    container.innerHTML = '<div style="color: #888; text-align: center; padding: 40px;">No anime content available.</div>';
                    return;
                }

                const popularAnime = items.slice(0, 5);
                const trendingAnime = items.length > 5 ? items.slice(5, 10) : [...items].reverse();

                function generateRow(title, iconHtml, rowItems) {
                    if (!rowItems || rowItems.length === 0) return '';
                    let cardsHtml = '';
                    rowItems.forEach(item => {
                        const itemIdStr = String(item.id || 'a-1');
                        const rating = (8.0 + ((itemIdStr.charCodeAt(0) % 15) / 10)).toFixed(1);
                        const year = item.publish_date ? new Date(item.publish_date).getFullYear() : '2026';
                        const rawThumb = item.thumb_portrait || item.thumbPortrait || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&q=80';
                        const thumbImg = window.getOptimizedImageUrl ? window.getOptimizedImageUrl(rawThumb, 320, 75) : rawThumb;
                        
                        cardsHtml += `
                        <div class="movie-card" onclick="window.location.href='watch.html?id=${item.id}'">
                            <div class="poster-wrapper">
                                <img src="${thumbImg}" alt="${item.title}" class="poster-img" loading="lazy" decoding="async" onerror="this.src='https://placehold.co/300x450/1a1a2e/ffffff?text=Anime'">
                                <div class="hd-badge">HD</div>
                            </div>
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">${year} • ${item.category || 'Anime'}</div>
                            <div class="card-rating">⭐ ${rating}</div>
                        </div>`;
                    });
                    return `
                    <div class="content-section">
                        <div class="section-header">
                            <div class="section-title">${iconHtml} ${title}</div>
                            <a href="search.html" class="view-all">View all &gt;</a>
                        </div>
                        <div class="cards-scroll hide-scroll">
                            ${cardsHtml}
                        </div>
                    </div>`;
                }

                container.innerHTML = 
                    generateRow('Popular Anime', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>', popularAnime) +
                    generateRow('Trending Anime Releases', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><path d="M15.2 22a7.1 7.1 0 0 0-2.6-4.8c-1.6-1.4-2.8-2.6-2.5-4.5.3-2 1.6-3.4 3-4.5-1.5 1-3.6 1.7-4.5 3.5-.8 1.6-.3 3.6 1 4.8A7.2 7.2 0 0 0 10 22"/><path d="M12 2C7 6 4 10.4 4 15a8 8 0 0 0 16 0c0-4.6-3-9-8-13z"/></svg>', trendingAnime);
            }

            renderRows(allAnimeData);

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    if (!query) {
                        renderRows(allAnimeData);
                    } else {
                        const filtered = allAnimeData.filter(i => 
                            (i.title && i.title.toLowerCase().includes(query)) ||
                            (i.desc && i.desc.toLowerCase().includes(query)) ||
                            (i.category && i.category.toLowerCase().includes(query))
                        );
                        renderRows(filtered);
                    }
                });
            }
        });
    </script>
    <!-- Floating Telegram Discussion Group Button -->

        <span class="floating-telegram-label">Request Movie (@seriesupdate2)</span>

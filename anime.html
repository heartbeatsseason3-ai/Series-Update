<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime - Series Update</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vanilla-ui.css">
    <link rel="stylesheet" href="responsive.css">
    
    <style>
        :root {
            --bg-dark: #050505;
            --accent-red: #E50914;
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --nav-bg: rgba(5, 5, 5, 0.95);
            --card-bg: #111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        a { text-decoration: none; color: inherit; }
        ::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            background: var(--nav-bg);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-logo { display: flex; align-items: center; gap: 8px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; }
        .header-logo a img, .header-logo img { height: 36px; width: auto; object-fit: contain; display: block; }
        .header-right { display: flex; align-items: center; gap: 12px; }

        .page-title-section { padding: 20px 20px 10px 20px; }
        .page-title {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .title-accent {
            width: 4px;
            height: 28px;
            background-color: var(--accent-red);
            border-radius: 2px;
        }
        .page-subtitle { color: var(--text-muted); font-size: 13px; }

        .search-filter-row { display: flex; gap: 12px; padding: 10px 20px; }
        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: #1a1c23;
            border-radius: 12px;
            padding: 10px 16px;
            gap: 10px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .content-section { margin-bottom: 24px; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 12px 20px;
        }
        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .view-all { color: var(--text-muted); font-size: 12px; font-weight: 500; }

        .cards-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 20px;
            scroll-snap-type: x mandatory;
        }
        .movie-card {
            flex: 0 0 130px;
            scroll-snap-align: start;
            cursor: pointer;
        }
        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a2e;
            margin-bottom: 8px;
        }
        .poster-img { width: 100%; height: 100%; object-fit: cover; }
        .hd-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(0,0,0,0.7);
            color: #ffd700;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .card-meta { font-size: 11px; color: var(--text-muted); }
        .card-rating { font-size: 11px; color: #ffd700; margin-top: 2px; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <a href="index.html">
                    <img src="https://i.ibb.co/S4mxsbrc/Chat-GPT-Image-Jun-7-2026-02-04-20-PMG.png" alt="Series Update Logo">
                </a>
            </div>
            <div class="desktop-nav">
                <a href="index.html" class="desktop-nav-item">Home</a>
                <a href="movie.html" class="desktop-nav-item">Movies</a>
                <a href="tvshow.html" class="desktop-nav-item">TV Shows</a>
                <a href="anime.html" class="desktop-nav-item active">Anime</a>
            </div>
        </div>
        <div class="header-right">
            <button aria-label="Action" class="header-icon" onclick="window.location.href='mylist.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button aria-label="Action" class="header-icon bell-container" onclick="window.location.href='notifications.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <div class="notification-dot" id="nav-notif-dot"></div>
            </button>
        </div>
    </header>

    <!-- Page Title -->
    <div class="page-title-section">
        <h1 class="page-title">
            <span class="title-accent"></span>
            Anime Series & Movies 🌸
        </h1>
        <p class="page-subtitle">Stream popular anime, dubs, subs & OVA specials in HD quality.</p>
    </div>

    <!-- Search Box -->
    <div class="search-filter-row">
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="anime-search-input" placeholder="Search anime titles, genres...">
        </div>
    </div>

    <!-- Content Container -->
    <main id="anime-content-container">
        <div class="anime-loading-state">Loading anime content...</div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="nav-text">Home</span>
        </a>
        <a href="movie.html" class="nav-item">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
            <span class="nav-text">Movies</span>
        </a>
        <a href="tvshow.html" class="nav-item">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
            <span class="nav-text">TV Shows</span>
        </a>
        <a href="anime.html" class="nav-item active">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" class="nav-icon"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>
            <span class="nav-text">Anime</span>
        </a>
        <a href="search.html" class="nav-item">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span class="nav-text">Search</span>
        </a>
    </nav>

    <!-- Supabase Connection & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script src="fullscreen-handler.js"></script>
    <script src="theme-handler.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('anime-content-container');
            const searchInput = document.getElementById('anime-search-input');
            let allAnimeData = [];

            if (!window.supabaseClient) {
                container.innerHTML = '<div style="color: #E50914; text-align: center; padding: 40px;">Database connection error.</div>';
                return;
            }

            // Fetch Anime content (by type 'Anime' OR category 'Anime')
            const { data, error } = await window.supabaseClient
                .from('content')
                .select('*')
                .or('type.ilike.%Anime%,category.ilike.%Anime%')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching anime:", error);
            }

            allAnimeData = data || [];

            // If no specific anime tagged items yet, show recent uploads
            if (allAnimeData.length === 0) {
                const { data: fallbackData } = await window.supabaseClient
                    .from('content')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);
                allAnimeData = fallbackData || [];
            }

            function renderRows(items) {
                if (!items || items.length === 0) {
                    container.innerHTML = '<div style="color: #888; text-align: center; padding: 40px;">No anime content available.</div>';
                    return;
                }

                const popularAnime = items.slice(0, 5);
                const trendingAnime = items.length > 5 ? items.slice(5, 10) : [...items].reverse();

                function generateRow(title, iconHtml, rowItems) {
                    if (rowItems.length === 0) return '';
                    let cardsHtml = '';
                    rowItems.forEach(item => {
                        const rating = (8.0 + ((item.id.charCodeAt(0) % 15) / 10)).toFixed(1);
                        const year = item.publish_date ? new Date(item.publish_date).getFullYear() : '2026';
                        cardsHtml += `
                        <div class="movie-card" onclick="window.location.href='watch.html?id=${item.id}'">
                            <div class="poster-wrapper">
                                <img src="${item.thumb_portrait}" alt="${item.title}" class="poster-img" loading="lazy" onerror="this.src='https://placehold.co/300x450/1a1a2e/ffffff?text=Anime'">
                                <div class="hd-badge">HD</div>
                            </div>
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">${year} • ${item.category || 'Anime'}</div>
                            <div class="card-rating">⭐ ${rating}</div>
                        </div>`;
                    });
                    return `
                    <div class="content-section">
                        <div class="section-header">
                            <div class="section-title">${iconHtml} ${title}</div>
                            <a href="search.html" class="view-all">View all &gt;</a>
                        </div>
                        <div class="cards-scroll hide-scroll">
                            ${cardsHtml}
                        </div>
                    </div>`;
                }

                container.innerHTML = 
                    generateRow('Popular Anime', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>', popularAnime) +
                    generateRow('Trending Anime Releases', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><path d="M15.2 22a7.1 7.1 0 0 0-2.6-4.8c-1.6-1.4-2.8-2.6-2.5-4.5.3-2 1.6-3.4 3-4.5-1.5 1-3.6 1.7-4.5 3.5-.8 1.6-.3 3.6 1 4.8A7.2 7.2 0 0 0 10 22"/><path d="M12 2C7 6 4 10.4 4 15a8 8 0 0 0 16 0c0-4.6-3-9-8-13z"/></svg>', trendingAnime);
            }

            renderRows(allAnimeData);

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    if (!query) {
                        renderRows(allAnimeData);
                    } else {
                        const filtered = allAnimeData.filter(i => 
                            (i.title && i.title.toLowerCase().includes(query)) ||
                            (i.desc && i.desc.toLowerCase().includes(query)) ||
                            (i.category && i.category.toLowerCase().includes(query))
                        );
                        renderRows(filtered);
                    }
                });
            }
        });
    </script>
</body>
</html>
